# Builds the portable Black Gate (Ultima7) and Serpent Isle (Serpent), and Ultima7Modern, for
# macOS, Windows and Linux: the two portable programs in one archive per platform, Ultima7Modern in
# another. A pushed tag starting with "v" also publishes the archives as a GitHub release; a manual
# run only keeps them as workflow artifacts.
name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  SHARED_DIR: ultima7-portable
  BG_DIR: ultima7-portable/Black Gate
  SI_DIR: ultima7-portable/Serpent Isle
  MODERN_DIR: ultima7-modern

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            suffix: ""
          - name: macos-arm64
            os: macos-14
            suffix: .app
          - name: windows-x64
            os: windows-2022
            suffix: .exe
    runs-on: ${{ matrix.os }}
    env:
      # Forks and unconfigured repos have no signing secrets; their Mac build stays self-signed.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      - name: Build (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          cmake -S "$BG_DIR" -B build-bg -DCMAKE_BUILD_TYPE=Release
          cmake --build build-bg --target u7 --parallel
          cmake -S "$SI_DIR" -B build-si -DCMAKE_BUILD_TYPE=Release
          cmake --build build-si --target serpent --parallel
          cmake -S "$MODERN_DIR" -B build-modern -DCMAKE_BUILD_TYPE=Release
          cmake --build build-modern --target modern --parallel

      # Developer ID signature, then Apple's notarization ticket stapled to each app, so macOS
      # opens them without "Open Anyway".
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2; exit }')
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          for app in build-bg/Ultima7.app build-si/Serpent.app build-modern/Ultima7Modern.app; do
            codesign --force --options runtime --timestamp --sign "$identity" "$app"
            codesign --verify --strict --verbose=2 "$app"
            "$SHARED_DIR/packaging/notarize.sh" "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done

      # libmatoya's makefile needs cmd's mkdir, so Git's usr\bin comes off the PATH.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Visual Studio's x64 tools (clang-cl, rc, link) onto the PATH.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Git\\usr\\bin' }) -join ';'
          foreach ($game in @(@("$env:BG_DIR", "build-bg", "u7"), @("$env:SI_DIR", "build-si", "serpent"),
                              @("$env:MODERN_DIR", "build-modern", "modern"))) {
            cmake -S $game[0] -B $game[1] -G Ninja -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --build $game[1] --target $game[2]
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Windows and Linux: a zip of a folder holding the programs. macOS: a disk image to drag the
      # apps from into Applications. The portable programs and Ultima7Modern are archived apart.
      - name: Package
        shell: bash
        run: |
          mkdir -p package/out
          # pack <folder> <archive name> <readme> <program...>
          pack() {
            local folder=$1 name=$2 readme=$3
            shift 3
            mkdir -p "package/$folder/licenses"
            cp -R "$@" "package/$folder/"
            cp "$readme" "package/$folder/README.txt"
            cp "$SHARED_DIR/third_party/libmatoya/LICENSE" "package/$folder/licenses/libmatoya-LICENSE"
            cp "$SHARED_DIR/third_party/munt/mt32emu/COPYING.LESSER.txt" "package/$folder/licenses/munt-COPYING.LESSER.txt"
            cp "$SHARED_DIR/third_party/munt/mt32emu/COPYING.txt" "package/$folder/licenses/munt-COPYING.txt"
            cp "$SHARED_DIR/third_party/nuked-opl3/LICENSE" "package/$folder/licenses/nuked-opl3-LICENSE"
            (
              cd package
              if [ "$RUNNER_OS" = "macOS" ]; then
                ln -s /Applications "$folder/Applications"
                hdiutil create -volname "$folder" -srcfolder "$folder" -format UDZO "out/$name.dmg"
              elif [ "$RUNNER_OS" = "Windows" ]; then
                7z a "out/$name.zip" "$folder" > /dev/null
              else
                zip -qr "out/$name.zip" "$folder"
              fi
            )
          }
          # The archive name tells the platforms apart; the folder inside is just the program's.
          tag="${GITHUB_REF_NAME//\//-}"
          pack Ultima7 "ultima7-portable-$tag-${{ matrix.name }}" "$SHARED_DIR/packaging/README.txt" \
            "build-bg/Ultima7${{ matrix.suffix }}" "build-si/Serpent${{ matrix.suffix }}"
          pack Ultima7Modern "ultima7-modern-$tag-${{ matrix.name }}" "$MODERN_DIR/packaging/README.txt" \
            "build-modern/Ultima7Modern${{ matrix.suffix }}"

      - name: Sign and notarize the disk image (macOS)
        if: runner.os == 'macOS' && env.HAS_SIGNING == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for archive in package/out/*.dmg; do
            codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$archive"
            "$SHARED_DIR/packaging/notarize.sh" "$archive"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$archive"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: package/out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: archives
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: archives/*
          generate_release_notes: true
